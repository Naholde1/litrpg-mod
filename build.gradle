plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

group = 'com.andrey.litrpg'
version = '2.9.0'

base {
    archivesName = 'litrpg-system'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            // миксины сторонних модов (Patchouli) в dev-окружении
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "litrpg" {
                    source sourceSets.main
                }
            }
        }
        client {
            // ./gradlew runClient -Pquickplay=testworld — сразу зайти в мир
            if (project.hasProperty('quickplay')) args '--quickPlaySingleplayer', project.property('quickplay')
        }
        server { args '--nogui' }
    }
}

repositories {
    maven { name = 'BlameJared (JEI, Patchouli)'; url = 'https://maven.blamejared.com/' }
    maven { name = 'Curios'; url = 'https://maven.theillusivec4.top/' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    // JEI: только API для компиляции, сам мод игрок ставит отдельно
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:${jei_version}")
    // Patchouli: книга «Кодекс Системы» описана в JSON, код нужен только для запуска в dev
    runtimeOnly fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}")
    // Curios: слоты для колец, амулета и пояса
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : 'litrpg',
                'Specification-Vendor'    : 'Andrey',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'Andrey'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
